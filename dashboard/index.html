<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>authwatch</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e8ee; --muted: #8b93a7;
    --high: #ff5f56; --medium: #ffbd2e; --low: #4a9eff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .08em; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 600; }
  .card .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button.on { border-color: var(--low); color: var(--low); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th { text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 500;
       font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
       border-bottom: 1px solid var(--line); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .sev { font-weight: 600; font-size: 12px; }
  .sev.high { color: var(--high); } .sev.medium { color: var(--medium); } .sev.low { color: var(--low); }
  .ip { color: var(--low); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>authwatch</h1>
  <div class="sub">SSH authentication log analysis</div>

  <div class="cards" id="cards"></div>

  <div class="filters">
    <button data-sev="" class="on">All</button>
    <button data-sev="high">High</button>
    <button data-sev="medium">Medium</button>
    <button data-sev="low">Low</button>
  </div>

  <table>
    <thead>
      <tr><th>Severity</th><th>Time</th><th>Rule</th><th class="hide-sm">Source</th><th>Summary</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
let severity = "";

async function load() {
  const [stats, alerts] = await Promise.all([
    fetch("/api/stats").then(r => r.json()),
    fetch("/api/alerts" + (severity ? "?severity=" + severity : "")).then(r => r.json())
  ]);

  const bySev = stats.alerts_by_severity || {};
  document.getElementById("cards").innerHTML = [
    ["Events", stats.total_events],
    ["Failed", stats.failed_events],
    ["Alerts", stats.total_alerts],
    ["High", bySev.high || 0],
    ["Medium", bySev.medium || 0]
  ].map(([l, n]) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  const tbody = document.getElementById("rows");
  if (!alerts.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">No alerts. Run: python -m authwatch ingest data/auth.log</td></tr>`;
    return;
  }
  tbody.innerHTML = alerts.map(a => `
    <tr>
      <td class="sev ${a.severity}">${a.severity.toUpperCase()}</td>
      <td>${a.timestamp.replace("T", " ")}</td>
      <td>${a.rule}</td>
      <td class="ip hide-sm">${a.source_ip}</td>
      <td>${a.summary}</td>
    </tr>`).join("");
}

document.querySelectorAll("button[data-sev]").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("button[data-sev]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    severity = b.dataset.sev;
    load();
  };
});

load();
setInterval(load, 15000);
</script>
</body>
</html>
